</style><main class="tool-width"><h1>企業研究・面談準備メモ</h1><p class="notice neutral">入力内容はこのページ内で処理し、サーバーへ送信しません。ページを閉じると消えるため、必要なメモはダウンロードしてください。AIによる調査・自動生成は行いません。</p><form id="research-tool" class="research-form"><label for="company">企業名 <span>必須</span></label><input id="company" name="company" required maxlength="160" autocomplete="off"><label for="business">事業・仕事内容</label><textarea id="business" name="business" rows="4" maxlength="8000"></textarea><label for="source">出典・参照したURL</label><textarea id="source" name="source" rows="3" maxlength="8000"></textarea><label for="questions">面談で聞きたいこと</label><textarea id="questions" name="questions" rows="4" maxlength="8000"></textarea><label for="next">次にやること</label><textarea id="next" name="next" rows="3" maxlength="8000"></textarea><button class="button" type="submit">メモを整理する</button></form><section id="tool-result" hidden aria-labelledby="result-heading"><h2 id="result-heading" tabindex="-1">企業研究・面談準備メモ</h2><pre id="research-output" class="memo-output"></pre><button class="button secondary" type="button" id="download-memo">メモをダウンロード</button><p role="status" id="memo-status"></p></section><noscript><p>整理ツールの実行にはJavaScriptが必要です。企業名・事業・出典・質問・次の行動の5項目を、お手元のメモ帳でも整理できます。</p></noscript></main><script>
let researchMemo = '';
document.querySelector('#research-tool')?.addEventListener('submit', event => {
  event.preventDefault();
  const data = new FormData(event.currentTarget);
  const company = String(data.get('company') || '').trim();
  if (!company) { document.querySelector('#company').focus(); return; }
  researchMemo = `# ${company} — 企業研究・面談準備\n\n` + [
    ['事業・仕事内容','business'], ['出典・参照URL','source'], ['面談で聞きたいこと','questions'], ['次にやること','next'],
  ].map(([label,key]) => `## ${label}\n\n${String(data.get(key) || '').trim() || '未記入'}`).join('\n\n') + '\n';
  document.querySelector('#research-output').textContent = researchMemo;
  document.querySelector('#tool-result').hidden = false;
  document.querySelector('#result-heading').focus();
  document.querySelector('#memo-status').textContent = 'メモを整理しました。保存する場合はダウンロードしてください。';
});
document.querySelector('#download-memo')?.addEventListener('click', () => {
  if (!researchMemo) return;
  const url = URL.createObjectURL(new Blob([researchMemo], {type:'text/markdown;charset=utf-8'}));
  const link = document.createElement('a');
  link.href = url; link.download = 'katazuku-research.md'; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  document.querySelector('#memo-status').textContent = 'ダウンロードを開始しました。';
});
</script></html>
