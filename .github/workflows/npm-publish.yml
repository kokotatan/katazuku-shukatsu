name: npm publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '公開する既存タグ（例: v0.3.0）'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Trusted Publishing
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - name: 公開前検査
        run: |
          npm run check
          npm pack --dry-run
          node tools/check-npm-release.mjs "$RELEASE_TAG"
      - name: 公開済みversionを確認
        id: registry
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version --json >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: npmへ公開
        if: steps.registry.outputs.already_published != 'true'
        run: npm publish
      - name: 公開済みのため終了
        if: steps.registry.outputs.already_published == 'true'
        run: echo "$RELEASE_TAG はnpmに公開済みです。再公開せず正常終了します。"
