name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 正のゲート: Node 24(node:sqlite 安定)で scan + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      # 個人情報・秘密情報の混入検査(形ベース)。固有名詞の遮断は private 側の SCAN_BLOCKLIST で行う。
      - run: npm run scan
      - run: npm run typecheck
      # 配布物(dist)が実際にビルドでき、公開エントリから読み込めることまで確認する
      - run: npm run build
      - run: node -e "import('./dist/index.js').then(m => { if (typeof m.openDb !== 'function') { throw new Error('dist の公開エントリが壊れています') } })"
      - run: npm pack --dry-run
      - run: npm test

  apps:
    # アプリ群が腐らないように、型検査とビルドまで通す。
    # コアの依存ゼロは保ったまま、UIは各アプリに閉じた package.json を持つ。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [board, status, inbox, insight, profile, people, prep, impact]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build

  compat-node22:
    # 互換確認: engines の下限 Node 22。node:sqlite は 22 系では experimental フラグが要る。
    # 情報提供目的で非ブロッキング(continue-on-error)。
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      NODE_OPTIONS: --experimental-sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
