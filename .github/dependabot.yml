version: 2
updates:
  # 更新PRは月1回・エコシステムごとに1本へまとめる(週次・個別PRだと通知が多すぎるため)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-all:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions-all:
        patterns:
          - "*"
